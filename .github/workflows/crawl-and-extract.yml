name: yy-lx-hub Crawl & Verify

on:
  schedule:
    # 每日北京时间凌晨 04:00 (UTC 20:00) 自动巡航
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore living archive (data/)
        uses: actions/cache@v4
        with:
          path: data
          key: yy-lx-hub-data-${{ github.run_id }}
          restore-keys: |
            yy-lx-hub-data-

      - name: Run dynamic radar, sandbox verify & API extraction
        env:
          CI: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AMUSIC_SYNC_KEY: ${{ secrets.AMUSIC_SYNC_KEY }}
          AMUSIC_SYNC_SECRET: ${{ secrets.AMUSIC_SYNC_SECRET }}
        run: node bin/extract.js

      - name: Print summary report (sanitized)
        run: |
          node -e "
            const fs = require('fs');
            if (fs.existsSync('public/data.json')) {
              const d = JSON.parse(fs.readFileSync('public/data.json', 'utf8'));
              console.log('=== 洛雪可用源摘要 ===');
              console.log('可用总数:', d.usableCount, '| 平台分布:', JSON.stringify(d.platformStats));
              for (const it of d.items) {
                console.log(' -', '[' + it.platforms.join('+') + ']', it.name, '(v' + (it.version || '?') + ')');
              }
            }
            if (fs.existsSync('public/extracted_apis.json')) {
              const a = JSON.parse(fs.readFileSync('public/extracted_apis.json', 'utf8'));
              console.log('=== 黄金 API 摘要（已脱敏，不含密钥/路径） ===');
              console.log('独立端点总数:', a.totalEndpoints, '| 密文包已生成:', fs.existsSync('public/extracted_apis.enc'));
              for (const ep of a.endpoints) {
                let host = 'unknown';
                try { host = new URL(ep.urlTemplate).hostname; } catch (e) {}
                console.log(' - [' + ep.platform + '][' + (ep.matchMode || 'id') + ']', ep.method, host, '(' + ep.sampleLatencyMs + 'ms)');
              }
            }
          "

      - name: Publish LX sources.zip to Release (sync-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f public/sources.zip ]; then
            echo "没有可发布的 sources.zip，跳过 Release 更新"
            exit 0
          fi
          NOTES="自动巡航更新时间: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          - 仅包含从全网公开仓库采集并实测通过的洛雪可用音源 .js 脚本（sources.zip）"
          if gh release view sync-latest >/dev/null 2>&1; then
            gh release upload sync-latest public/sources.zip --clobber
            gh release delete-asset sync-latest data.json -y >/dev/null 2>&1 || true
            gh release delete-asset sync-latest extracted_apis.enc -y >/dev/null 2>&1 || true
            gh release edit sync-latest --notes "$NOTES"
          else
            gh release create sync-latest public/sources.zip --title "yy-lx-hub 每日可用洛雪音源包" --notes "$NOTES"
          fi

      - name: Publish encrypted Amusic bundle to dedicated Release (amusic-sync)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f public/extracted_apis.enc ]; then
            echo "没有可发布的 extracted_apis.enc，跳过"
            exit 0
          fi
          NOTES="Amusic 专用加密接口同步包（自动更新: $(date -u '+%Y-%m-%d %H:%M:%S UTC')）"
          if gh release view amusic-sync >/dev/null 2>&1; then
            gh release upload amusic-sync public/extracted_apis.enc --clobber
            gh release edit amusic-sync --notes "$NOTES"
          else
            gh release create amusic-sync public/extracted_apis.enc --prerelease --title "Amusic 专用加密同步包" --notes "$NOTES"
          fi

      - name: Upload verified LX sources archive (sources.zip only)
        uses: actions/upload-artifact@v4
        with:
          name: yy-lx-hub-outputs
          retention-days: 14
          if-no-files-found: ignore
          path: public/sources.zip
